openapi: 3.1.0
info:
  title: Relis API
  version: 0.1.0
  description: |
    API contract between `client/` and `server/`.
    This file is the source of truth: change it in the same pull request as the code,
    and change it first when the two sides need to agree on something new.
    Covers Sprint 0 (auth), Sprint 1 (tests, uploads, attempts), Sprint 2 (classes; grading, review, history), Sprint 3 (assignments, home goals) and Sprint 4 (AI feedback).

servers:
  - url: https://relis-ielts-api.onrender.com/api
    description: Production (Render)
  - url: http://localhost:5000/api
    description: Local

security:
  - bearerAuth: []

tags:
  - name: System
    description: Health check and this documentation
  - name: Auth
    description: Google sign-in and the current user (owner A)
  - name: Tests
    description: Personal test library and editor (owner A)
  - name: Uploads
    description: Cover images and audio files on Cloudinary (owner A)
  - name: Attempts
    description: Taking a test (owner B)
  - name: Classes
    description: Classes, class library and gradebook (owner A)
  - name: Vocabulary
    description: Personal vocabulary sets and their words (US47, US48)

paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Check that the server is running
      security: []
      responses:
        '200':
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, const: true }

  /docs:
    get:
      operationId: getDocs
      tags: [System]
      summary: This documentation as a Swagger UI page
      security: []
      responses:
        '200':
          description: HTML page that loads /docs/openapi.yaml
          content:
            text/html:
              schema: { type: string }

  /docs/openapi.yaml:
    get:
      operationId: getOpenApiContract
      tags: [System]
      summary: The raw OpenAPI contract (this file)
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document
          content:
            text/yaml:
              schema: { type: string }

  /auth/google:
    post:
      operationId: signInWithGoogle
      tags: [Auth]
      summary: Sign in or sign up with a Google ID token (US01)
      description: |
        The server verifies `credential` with Google, creates the user on the first sign-in,
        updates name and picture on later sign-ins, and returns the app's own JWT (valid 7 days).
        When the request also carries a guest's token and this Google account does not exist yet,
        the guest becomes this Google account and keeps their tests and attempts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [credential]
              properties:
                credential:
                  type: string
                  description: ID token returned by the Google sign-in button
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401':
          description: Google rejected the token (`INVALID_GOOGLE_TOKEN`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/guest:
    post:
      operationId: signInAsGuest
      tags: [Auth]
      summary: Try Relis without an account
      description: |
        Creates a guest user and returns its token. A guest can use everything except creating
        or joining a class (`403 GUEST_NOT_ALLOWED`). At most 10 guests per IP address per hour.
      security: []
      responses:
        '201':
          description: Guest created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '429':
          description: Too many guest accounts from this address (`TOO_MANY_GUESTS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [Auth]
      summary: Current user (US02)
      description: Called when the app opens, to check whether the saved token is still valid.
      responses:
        '200':
          description: The signed-in user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tests:
    get:
      operationId: listMyTests
      tags: [Tests]
      summary: My test library, or the system tests (US20, US22, US23)
      description: |
        By default lists the caller's own tests. `source=system` lists the published system tests
        that come with Relis instead; every signed-in user can take those, nobody can edit them.
      parameters:
        - { name: source, in: query, description: 'mine (default) or system', schema: { type: string, enum: [mine, system] } }
        - { name: skill, in: query, schema: { $ref: '#/components/schemas/Skill' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/TestKind' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/TestStatus' } }
        - { name: q, in: query, description: Search in the title, schema: { type: string } }
        - { name: done, in: query, description: 'true = tests I submitted at least once (alone or in a class), false = not yet (US23)', schema: { type: string, enum: ['true', 'false'] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: One page of tests, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/TestSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createTest
      tags: [Tests]
      summary: Create an empty draft test (US11)
      description: |
        Creates the right number of empty sections for the kind:
        Reading full = 3 passages, Listening full = 4 parts, single = 1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, skill, kind]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                skill: { $ref: '#/components/schemas/Skill' }
                kind: { $ref: '#/components/schemas/TestKind' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  test: { $ref: '#/components/schemas/Test' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tests/{testId}:
    parameters:
      - $ref: '#/components/parameters/TestId'
    get:
      operationId: getTest
      tags: [Tests]
      summary: Full test with answers, for the editor (US20)
      description: Owner only. Other users get 404, so they cannot tell whether the test exists.
      responses:
        '200':
          description: The test
          content:
            application/json:
              schema:
                type: object
                properties:
                  test: { $ref: '#/components/schemas/Test' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: saveTest
      tags: [Tests]
      summary: Save the whole test (US12–US18)
      description: |
        The editor always sends the complete test. The server renumbers questions 1..n,
        recalculates `questionCount`, and keeps question `id`s that already exist.
        If someone has already submitted this test and an answer changed, the response
        carries `warning: ANSWERS_CHANGED_AFTER_ATTEMPTS` (old scores stay as they were).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TestInput' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  test: { $ref: '#/components/schemas/Test' }
                  warning:
                    type: [string, 'null']
                    enum: [ANSWERS_CHANGED_AFTER_ATTEMPTS, null]
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteTest
      tags: [Tests]
      summary: Delete a test (US20)
      description: Deleted for real if nobody has taken it; otherwise hidden so history and gradebooks keep working.
      responses:
        '204': { description: Deleted or hidden }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /tests/{testId}/status:
    parameters:
      - $ref: '#/components/parameters/TestId'
    patch:
      operationId: changeTestStatus
      tags: [Tests]
      summary: Publish a test or move it back to draft (US19)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/TestStatus' }
      responses:
        '200':
          description: Status changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  test: { $ref: '#/components/schemas/TestSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: Cannot publish (`TEST_INCOMPLETE`); `details` lists the questions without an answer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /tests/{testId}/play:
    parameters:
      - $ref: '#/components/parameters/TestId'
    get:
      operationId: getTestForPlay
      tags: [Tests]
      summary: Test without answers, for the choose-mode dialog (US24, US26)
      description: |
        Allowed for the owner, or a member of a class that has this test (from Sprint 2).
        Never contains answers, explanations, evidence or transcripts.
      responses:
        '200':
          description: The test, safe to show while taking it
          content:
            application/json:
              schema:
                type: object
                properties:
                  test: { $ref: '#/components/schemas/PlayTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /uploads:
    post:
      operationId: uploadFile
      tags: [Uploads]
      summary: Upload a cover image or an audio file (US12, US14)
      description: Stored on Cloudinary; the database only keeps the returned URL.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, kind]
              properties:
                file: { type: string, format: binary }
                kind:
                  type: string
                  enum: [image, audio]
                  description: image ≤ 2 MB (jpg, png, webp); audio ≤ 30 MB (mp3, m4a)
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
                  durationSec:
                    type: number
                    description: Audio only
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File too large (`FILE_TOO_LARGE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attempts:
    get:
      operationId: listMyAttempts
      tags: [Attempts]
      summary: My history, newest first (US39)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [in_progress, submitted] }
        - name: skill
          in: query
          schema: { $ref: '#/components/schemas/Skill' }
        - name: source
          in: query
          description: '`self` = practised alone, `class` = started from a class library'
          schema: { type: string, enum: [self, class] }
        - name: range
          in: query
          schema: { type: string, enum: [7d, 30d, all], default: all }
        - name: q
          in: query
          description: Part of the test title
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of attempts; the client groups them by week
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageInfo'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/HistoryItem' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: startAttempt
      tags: [Attempts]
      summary: Start taking a test (US24, US25)
      description: |
        Creates an attempt with status `in_progress` and returns it with the test (no answers).
        If the user already has an unfinished attempt on the same test, returns 409 with
        `details.attemptId` so the client can offer to continue it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testId, mode]
              properties:
                testId: { $ref: '#/components/schemas/Id' }
                classId:
                  description: Set when the test is started from a class library; the attempt then appears in that class gradebook
                  oneOf:
                    - $ref: '#/components/schemas/Id'
                    - type: 'null'
                assignmentId:
                  description: |
                    Set when the test is taken as a class assignment (US44); the class is then taken from the assignment.
                    After the deadline this returns 422 `DEADLINE_PASSED` unless the teacher allowed late work.
                  oneOf:
                    - $ref: '#/components/schemas/Id'
                    - type: 'null'
                mode: { $ref: '#/components/schemas/AttemptMode' }
      responses:
        '201':
          description: Started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptWithTest' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: An unfinished attempt exists (`ATTEMPT_IN_PROGRESS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Assignment deadline passed and late work not allowed (`DEADLINE_PASSED`), or the chosen parts have no questions (`NO_QUESTIONS`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attempts/activity:
    get:
      operationId: getActivity
      tags: [Attempts]
      summary: Submissions per day and study minutes, for the home page calendar (US42)
      description: |
        Counts my submitted attempts per day in the given time zone, split by skill, and adds up
        the minutes from start to submit (each attempt capped at its time limit).
        `currentStreak` is the number of days in a row with a submission, ending today
        (or yesterday when nothing is submitted yet today). At most 62 days per request.
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date }, example: '2026-10-26' }
        - { name: to, in: query, required: true, schema: { type: string, format: date }, example: '2026-12-06' }
        - name: tz
          in: query
          description: IANA time zone of the viewer; unknown names fall back to Asia/Ho_Chi_Minh
          schema: { type: string, example: Asia/Ho_Chi_Minh }
      responses:
        '200':
          description: Days that have at least one submission, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [days, currentStreak]
                properties:
                  days:
                    type: array
                    items:
                      type: object
                      required: [date, reading, listening, minutes]
                      properties:
                        date: { type: string, format: date }
                        reading: { type: integer }
                        listening: { type: integer }
                        minutes: { type: integer }
                  currentStreak: { type: integer }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /attempts/study-time:
    get:
      operationId: getStudyTime
      tags: [Attempts]
      summary: Minutes studied per month, split by skill, for the home page chart (US42)
      description: |
        Adds up the minutes of my submitted attempts (start to submit, each capped at its time limit)
        per month in the given time zone. Every month of the range has a row, also months with nothing.
      parameters:
        - name: months
          in: query
          description: How many months, ending with the current one (1–12)
          schema: { type: integer, minimum: 1, maximum: 12, default: 5 }
        - name: tz
          in: query
          description: IANA time zone of the viewer; unknown names fall back to Asia/Ho_Chi_Minh
          schema: { type: string, example: Asia/Ho_Chi_Minh }
      responses:
        '200':
          description: One row per month, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [months]
                properties:
                  months:
                    type: array
                    items:
                      type: object
                      required: [month, readingMinutes, listeningMinutes]
                      properties:
                        month: { type: string, example: '2026-11' }
                        readingMinutes: { type: integer }
                        listeningMinutes: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /attempts/{attemptId}:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      operationId: getAttempt
      tags: [Attempts]
      summary: Continue an attempt (US30, US31, US33)
      description: |
        `remainingSec` is calculated by the server from `startedAt` and the time limit.
        If time is already up, the server submits the attempt first and returns it as `submitted`.
      responses:
        '200':
          description: The attempt and its test (no answers)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttemptWithTest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attempts/{attemptId}/answers:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    patch:
      operationId: saveAnswers
      tags: [Attempts]
      summary: Autosave answers (US33)
      description: The client sends only the questions that changed (debounced ~1 s). Rejected after time is up.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answers]
              properties:
                answers:
                  type: array
                  items: { $ref: '#/components/schemas/Answer' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  savedAt: { type: string, format: date-time }
                  remainingSec: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already submitted or time is up (`ATTEMPT_CLOSED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attempts/{attemptId}/submit:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      operationId: submitAttempt
      tags: [Attempts]
      summary: Submit and score (US31, US32, US35)
      description: |
        Sets `status: submitted` and scores the attempt: each answer gets `correct`, and `result`
        is filled. `band` is only set for a full test of 40 questions. The score is stored, so editing
        the test later does not change it. Submitting twice returns the same result.
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema:
                type: object
                required: [attemptId, status]
                properties:
                  attemptId: { $ref: '#/components/schemas/Id' }
                  status: { type: string, const: submitted }
                  result: { $ref: '#/components/schemas/Result' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /attempts/{attemptId}/feedback:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    post:
      operationId: requestFeedback
      tags: [Attempts]
      summary: AI feedback on my submitted attempt (US49)
      description: |
        Only the person who took the attempt. Made once with Gemini from the score per question type
        (the passage and the user's name are never sent), then stored on the attempt; later calls return the stored one.
      responses:
        '200':
          description: Feedback made earlier
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback: { $ref: '#/components/schemas/Feedback' }
        '201':
          description: Feedback made now
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback: { $ref: '#/components/schemas/Feedback' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Still in progress (`ATTEMPT_NOT_SUBMITTED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Gemini failed, quota used up or no API key on the server (`AI_FEEDBACK_FAILED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /attempts/{attemptId}/review:
    parameters:
      - $ref: '#/components/parameters/AttemptId'
    get:
      operationId: reviewAttempt
      tags: [Attempts]
      summary: Review a submitted attempt (US36, US37, US41)
      description: |
        The person who took it can always open it; a teacher can open it when the attempt was
        started from their class (`viewerRole: teacher`, read-only).
        Contains the taken sections with answers, explanations, evidence and transcripts.
      responses:
        '200':
          description: The attempt and the test with answers
          content:
            application/json:
              schema:
                type: object
                required: [attempt, test, viewerRole]
                properties:
                  attempt: { $ref: '#/components/schemas/Attempt' }
                  test: { $ref: '#/components/schemas/ReviewTest' }
                  viewerRole: { type: string, enum: [owner, teacher] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Still in progress (`ATTEMPT_NOT_SUBMITTED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /classes:
    get:
      operationId: listMyClasses
      tags: [Classes]
      summary: Classes I teach and classes I study in (US07)
      parameters:
        - name: role
          in: query
          schema: { type: string, enum: [teacher, student] }
          description: Leave out to get both
      responses:
        '200':
          description: My classes, newest membership first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ClassInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createClass
      tags: [Classes]
      summary: Create a class; the creator becomes its teacher (US04)
      description: The server generates a unique 6-character code (A–Z and 2–9, without O/0/I/1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 80 }
                description: { type: string, maxLength: 300 }
                color: { $ref: '#/components/schemas/ClassColor' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [class]
                properties:
                  class: { $ref: '#/components/schemas/ClassInfo' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Guests cannot use classes (`GUEST_NOT_ALLOWED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /classes/join:
    post:
      operationId: joinClass
      tags: [Classes]
      summary: Join a class with its code (US06)
      description: Spaces and lower case in the code are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: AB3K9Z }
      responses:
        '201':
          description: Joined as a student
          content:
            application/json:
              schema:
                type: object
                required: [class]
                properties:
                  class: { $ref: '#/components/schemas/ClassInfo' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Guests cannot use classes (`GUEST_NOT_ALLOWED`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already a member (`ALREADY_MEMBER`); `details.classId`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /classes/{classId}:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      operationId: getClass
      tags: [Classes]
      summary: Class details (US05)
      description: Members only. `code` is filled only for teachers.
      responses:
        '200':
          description: The class
          content:
            application/json:
              schema:
                type: object
                required: [class]
                properties:
                  class: { $ref: '#/components/schemas/ClassInfo' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/members:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      operationId: listClassMembers
      tags: [Classes]
      summary: Members of the class, teachers first (teacher only)
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        user: { $ref: '#/components/schemas/PublicUser' }
                        role: { type: string, enum: [teacher, student] }
                        joinedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ClassId'
      - name: userId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      operationId: removeStudent
      tags: [Classes]
      summary: Remove a student from the class (US09, teacher only)
      description: The student's attempts are kept, so their own history is not lost. Teachers cannot be removed.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/membership:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    delete:
      operationId: leaveClass
      tags: [Classes]
      summary: Leave the class (US10, students)
      description: Submitted attempts stay in the student's history. Joining again needs the class code.
      responses:
        '204': { description: Left the class }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The teacher cannot leave their own class (`TEACHER_CANNOT_LEAVE`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /classes/{classId}/library:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      operationId: listClassLibrary
      tags: [Classes]
      summary: Tests in the class library (US22)
      description: Members only. `lastBand` is the caller's own latest full-test band.
      responses:
        '200':
          description: Tests, most recently added first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/TestSummary'
                        - type: object
                          properties:
                            addedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: addToClassLibrary
      tags: [Classes]
      summary: Add some of my published tests to the class (US21, teacher only)
      description: |
        Tests already in the class are skipped, so repeating the request is harmless.
        To add to several classes, the client calls this once per class.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testIds]
              properties:
                testIds:
                  type: array
                  minItems: 1
                  items: { $ref: '#/components/schemas/Id' }
      responses:
        '200':
          description: How many tests were new to the class
          content:
            application/json:
              schema:
                type: object
                properties:
                  added: { type: integer }
        '400':
          description: A test is not one of my published tests (`VALIDATION_ERROR`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/library/{testId}:
    parameters:
      - $ref: '#/components/parameters/ClassId'
      - $ref: '#/components/parameters/TestId'
    delete:
      operationId: removeFromClassLibrary
      tags: [Classes]
      summary: Remove a test from the class (US21, teacher only)
      description: Attempts already made from the class are kept.
      responses:
        '204': { description: Removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/leaderboard:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      operationId: getLeaderboard
      tags: [Classes]
      summary: This week's ranking of the class students (any member, home page)
      description: |
        Counts what each student submitted in this class from Monday to Sunday of the current week
        (in the `tz` time zone). Ranked by submissions, then minutes; ties share a rank.
        `change` is how many places the student moved since last week (positive = up),
        or `null` when they submitted nothing last week.
      parameters:
        - name: tz
          in: query
          description: IANA time zone of the viewer; unknown names fall back to Asia/Ho_Chi_Minh
          schema: { type: string, example: Asia/Ho_Chi_Minh }
      responses:
        '200':
          description: Every student of the class, best first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [userId, name, count, minutes, averageBand, rank, change]
                      properties:
                        userId: { $ref: '#/components/schemas/Id' }
                        name: { type: string }
                        avatarUrl: { type: [string, 'null'] }
                        count: { type: integer, description: Submissions this week }
                        minutes: { type: integer }
                        averageBand: { type: [number, 'null'], description: "Mean of this week's full-test bands, rounded to 0.5" }
                        rank: { type: integer }
                        change: { type: [integer, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/gradebook:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      operationId: getGradebook
      tags: [Classes]
      summary: Scores of every student on every class test (US40, teacher only)
      description: |
        One row per student, one cell per test in the class library.
        A cell is the student's latest submitted attempt started from this class, or `null`.
        `averageBand` is the mean of the full-test bands, rounded the IELTS way.
      responses:
        '200':
          description: The gradebook
          content:
            application/json:
              schema:
                type: object
                required: [tests, rows]
                properties:
                  tests:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { $ref: '#/components/schemas/Id' }
                        title: { type: string }
                        skill: { $ref: '#/components/schemas/Skill' }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        student: { $ref: '#/components/schemas/PublicUser' }
                        averageBand: { type: [number, 'null'] }
                        cells:
                          type: array
                          items:
                            oneOf:
                              - type: 'null'
                              - type: object
                                properties:
                                  testId: { $ref: '#/components/schemas/Id' }
                                  attemptId: { $ref: '#/components/schemas/Id' }
                                  correct: { type: [integer, 'null'] }
                                  total: { type: [integer, 'null'] }
                                  band: { type: [number, 'null'] }
                                  submittedAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /users/me:
    patch:
      operationId: updateMyProfile
      tags: [Auth]
      summary: Set target bands and exam date (US46)
      description: Only the fields sent change; `null` clears a field.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goals:
                  type: object
                  properties:
                    reading: { $ref: '#/components/schemas/BandOrNull' }
                    listening: { $ref: '#/components/schemas/BandOrNull' }
                    overall: { $ref: '#/components/schemas/BandOrNull' }
                examDate: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: The updated user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /classes/{classId}/assignments:
    parameters:
      - $ref: '#/components/parameters/ClassId'
    get:
      operationId: listAssignments
      tags: [Classes]
      summary: Assignments of the class, nearest deadline first (US44, US45)
      description: |
        Teachers get `submittedCount`, `studentCount`, `averageBand` and `averageCorrect`.
        Students get `myStatus` (todo, in_progress, submitted, late, missed), `myAttemptId` and `myResult`.
      responses:
        '200':
          description: Assignments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Assignment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: createAssignment
      tags: [Classes]
      summary: Assign one of my published tests with a deadline (US44, teacher only)
      description: The test is also added to the class library so students can open it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [testId, deadline]
              properties:
                testId: { $ref: '#/components/schemas/Id' }
                deadline: { type: string, format: date-time, description: Must be in the future }
                allowLate: { type: boolean, default: false }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  assignment: { $ref: '#/components/schemas/Assignment' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /classes/{classId}/assignments/{assignmentId}:
    parameters:
      - $ref: '#/components/parameters/ClassId'
      - name: assignmentId
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Id' }
    delete:
      operationId: deleteAssignment
      tags: [Classes]
      summary: Delete an assignment (teacher only); attempts already made are kept
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vocab-sets:
    get:
      operationId: listMyVocabSets
      tags: [Vocabulary]
      summary: My vocabulary sets as cards, most recently changed first (US47)
      responses:
        '200':
          description: My sets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/VocabSetSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createVocabSet
      tags: [Vocabulary]
      summary: Create a set; only the name is required (US47)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VocabSetInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { $ref: '#/components/schemas/VocabSet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /vocab-sets/{setId}:
    parameters:
      - { name: setId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    get:
      operationId: getVocabSet
      tags: [Vocabulary]
      summary: A set with all its words, newest first (owner only)
      responses:
        '200':
          description: The set
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { $ref: '#/components/schemas/VocabSet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateVocabSet
      tags: [Vocabulary]
      summary: Rename a set or change its colour or cover
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VocabSetInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  set: { $ref: '#/components/schemas/VocabSet' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteVocabSet
      tags: [Vocabulary]
      summary: Delete a set and its words
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /vocab-sets/{setId}/words:
    parameters:
      - { name: setId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    post:
      operationId: addVocabWord
      tags: [Vocabulary]
      summary: Add a word (US48); the same term twice in a set is 409 `DUPLICATE_WORD`
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VocabWordInput' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  word: { $ref: '#/components/schemas/VocabWord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The term is already in this set (`DUPLICATE_WORD`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /vocab-sets/{setId}/words/{wordId}:
    parameters:
      - { name: setId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
      - { name: wordId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    put:
      operationId: updateVocabWord
      tags: [Vocabulary]
      summary: Replace every field of a word (US48)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VocabWordInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  word: { $ref: '#/components/schemas/VocabWord' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Another word of the set has this term (`DUPLICATE_WORD`)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteVocabWord
      tags: [Vocabulary]
      summary: Delete a word
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The token returned by `POST /auth/google`

  parameters:
    TestId:
      name: testId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    ClassId:
      name: classId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Id' }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }

  responses:
    ValidationError:
      description: The request body or query is invalid (`VALIDATION_ERROR`); `details` lists each field
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error:
              code: VALIDATION_ERROR
              message: Dữ liệu không hợp lệ
              details:
                - { field: title, message: Tiêu đề không được để trống }
    Unauthorized:
      description: Missing, invalid or expired token (`UNAUTHENTICATED`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Does not exist, or the user is not allowed to see it (`NOT_FOUND`)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Id:
      type: string
      description: MongoDB ObjectId as a 24-character hex string
      pattern: '^[a-f0-9]{24}$'
      example: 6730a1f2c4e5d6b7a8091234

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable code; the client chooses the Vietnamese text from it
              example: NOT_FOUND
            message:
              type: string
              description: Human-readable explanation, for logs and debugging
            details:
              description: Extra data, e.g. invalid fields or an existing attempt id

    PageInfo:
      type: object
      properties:
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    Skill:
      type: string
      enum: [reading, listening]
    TestKind:
      type: string
      enum: [full, single]
      description: full = 3 passages (Reading) or 4 parts (Listening); single = 1
    TestStatus:
      type: string
      enum: [draft, published]
    QuestionType:
      type: string
      enum: [mcq, multi_select, tfng, ynng, matching, completion, short_answer]

    User:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string, format: email, description: 'Missing for guests' }
        isGuest: { type: boolean, description: 'A guest cannot create or join classes' }
        avatarUrl: { type: string, format: uri }
        goals:
          type: object
          properties:
            reading: { type: [number, 'null'] }
            listening: { type: [number, 'null'] }
            overall: { type: [number, 'null'] }
        examDate: { type: [string, 'null'], format: date }

    AuthResult:
      type: object
      required: [token, user]
      properties:
        token: { type: string }
        user: { $ref: '#/components/schemas/User' }

    TestSummary:
      type: object
      description: One card in the test library
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        skill: { $ref: '#/components/schemas/Skill' }
        kind: { $ref: '#/components/schemas/TestKind' }
        status: { $ref: '#/components/schemas/TestStatus' }
        coverUrl: { type: [string, 'null'], format: uri }
        durationMin: { type: integer }
        questionCount: { type: integer }
        updatedAt: { type: string, format: date-time }
        isSystem: { type: boolean, description: 'A system test that comes with Relis (read-only)' }
        lastBand:
          type: [number, 'null']
          description: Band of the caller's latest full attempt, for the band stamp

    Test:
      type: object
      description: Full test as the owner sees it in the editor
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        skill: { $ref: '#/components/schemas/Skill' }
        kind: { $ref: '#/components/schemas/TestKind' }
        status: { $ref: '#/components/schemas/TestStatus' }
        coverUrl: { type: [string, 'null'], format: uri }
        durationMin: { type: integer }
        questionCount: { type: integer }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TestInput:
      type: object
      description: What the editor sends on save
      required: [title, sections]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        coverUrl: { type: [string, 'null'], format: uri }
        durationMin: { type: integer, minimum: 1, maximum: 180 }
        sections:
          type: array
          items: { $ref: '#/components/schemas/Section' }

    Section:
      type: object
      description: A Reading passage or a Listening part
      properties:
        title: { type: string }
        passage:
          type: string
          description: Reading only
        audioUrl:
          type: [string, 'null']
          format: uri
          description: Listening only
        audioDurationSec: { type: [number, 'null'] }
        transcript:
          type: string
          description: Listening only; shown on the review page
        groups:
          type: array
          items: { $ref: '#/components/schemas/QuestionGroup' }

    QuestionGroup:
      type: object
      properties:
        type: { $ref: '#/components/schemas/QuestionType' }
        instruction: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/Question' }

    Question:
      type: object
      properties:
        id:
          description: Set by the server; omit for a new question
          $ref: '#/components/schemas/Id'
        number:
          type: integer
          description: Set by the server (1..n across the whole test)
        prompt: { type: string }
        options:
          type: array
          items: { type: string }
          description: Choices for mcq, multi_select, tfng, ynng, matching
        answers:
          type: array
          items: { type: string }
          minItems: 1
          description: All accepted answers, e.g. ["10", "ten"]; the full correct set for multi_select
        explanation:
          type: array
          items: { type: string }
          description: Explanation steps shown on the review page
        evidence:
          description: Character range in the passage or transcript (US18)
          oneOf:
            - $ref: '#/components/schemas/TextRange'
            - type: 'null'

    TextRange:
      type: object
      required: [start, end]
      properties:
        start: { type: integer, minimum: 0 }
        end: { type: integer, minimum: 0 }

    PlayTest:
      type: object
      description: Test without answers, explanations, evidence or transcripts
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        skill: { $ref: '#/components/schemas/Skill' }
        kind: { $ref: '#/components/schemas/TestKind' }
        durationMin: { type: integer }
        questionCount: { type: integer }
        sections:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              passage: { type: string }
              audioUrl: { type: [string, 'null'], format: uri }
              audioDurationSec: { type: [number, 'null'] }
              groups:
                type: array
                items:
                  type: object
                  properties:
                    type: { $ref: '#/components/schemas/QuestionType' }
                    instruction: { type: string }
                    questions:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Id' }
                          number: { type: integer }
                          prompt: { type: string }
                          options:
                            type: array
                            items: { type: string }

    AttemptMode:
      type: object
      required: [type, sectionIndexes, timeLimitMin]
      properties:
        type:
          type: string
          enum: [full, parts]
          description: Only `full` gets a band score
        sectionIndexes:
          type: array
          items: { type: integer, minimum: 0 }
          minItems: 1
          example: [0, 1, 2]
        timeLimitMin: { type: integer, minimum: 1, maximum: 180 }

    Answer:
      type: object
      required: [questionId, value]
      properties:
        questionId: { $ref: '#/components/schemas/Id' }
        value:
          type: array
          items: { type: string }
          description: One item for most questions; several for multi_select; empty = cleared
        correct:
          type: boolean
          description: Only after submitting; never sent by the client

    Result:
      type: object
      properties:
        correct: { type: integer }
        total: { type: integer }
        band:
          type: [number, 'null']
          description: Only for full tests with 40 questions

    Attempt:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        testId: { $ref: '#/components/schemas/Id' }
        classId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        assignmentId:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        isLate: { type: boolean, description: Handed in after the assignment deadline }
        feedback:
          oneOf:
            - $ref: '#/components/schemas/Feedback'
            - type: 'null'
        mode: { $ref: '#/components/schemas/AttemptMode' }
        status:
          type: string
          enum: [in_progress, submitted]
        answers:
          type: array
          items: { $ref: '#/components/schemas/Answer' }
        remainingSec: { type: integer }
        startedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        result:
          oneOf:
            - $ref: '#/components/schemas/Result'
            - type: 'null'

    AttemptWithTest:
      type: object
      required: [attempt, test]
      properties:
        attempt: { $ref: '#/components/schemas/Attempt' }
        test: { $ref: '#/components/schemas/PlayTest' }

    ClassColor:
      type: string
      enum: [purple, blue, green, orange, pink]
      default: purple

    ClassInfo:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: string }
        color: { $ref: '#/components/schemas/ClassColor' }
        code:
          type: [string, 'null']
          description: Only teachers of the class get the code
        myRole: { type: string, enum: [teacher, student] }
        studentCount: { type: integer }
        teacherName:
          type: [string, 'null']
          description: Only in GET /classes
        openAssignmentCount: { type: integer, description: 'GET /classes, teachers: assignments whose deadline has not passed' }
        recentSubmissionCount: { type: integer, description: 'GET /classes, teachers: student attempts submitted in the last 7 days' }
        assignmentCount: { type: integer, description: 'GET /classes, students: assignments in the class' }
        submittedCount: { type: integer, description: 'GET /classes, students: assignments I handed in' }
        nextDue:
          description: 'GET /classes, students: the nearest assignment I still have to do'
          oneOf:
            - type: 'null'
            - type: object
              properties:
                title: { type: string }
                deadline: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    PublicUser:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        email: { type: string }
        avatarUrl: { type: [string, 'null'] }

    ReviewTest:
      type: object
      description: Only the sections that were taken; `index` is the section's position in the whole test
      properties:
        id: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        skill: { $ref: '#/components/schemas/Skill' }
        kind: { $ref: '#/components/schemas/TestKind' }
        sections:
          type: array
          items:
            type: object
            properties:
              index: { type: integer }
              title: { type: string }
              passage: { type: string }
              audioUrl: { type: [string, 'null'] }
              transcript: { type: string }
              groups:
                type: array
                items:
                  type: object
                  properties:
                    type: { $ref: '#/components/schemas/QuestionType' }
                    instruction: { type: string }
                    questions:
                      type: array
                      items:
                        type: object
                        properties:
                          id: { $ref: '#/components/schemas/Id' }
                          number: { type: integer }
                          prompt: { type: string }
                          options: { type: array, items: { type: string } }
                          answers: { type: array, items: { type: string } }
                          explanation: { type: array, items: { type: string } }
                          evidence:
                            oneOf:
                              - $ref: '#/components/schemas/TextRange'
                              - type: 'null'

    HistoryItem:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        status: { type: string, enum: [in_progress, submitted] }
        mode: { $ref: '#/components/schemas/AttemptMode' }
        result:
          oneOf:
            - $ref: '#/components/schemas/Result'
            - type: 'null'
        startedAt: { type: string, format: date-time }
        submittedAt: { type: [string, 'null'], format: date-time }
        test:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Id' }
            title: { type: string }
            skill: { $ref: '#/components/schemas/Skill' }
            kind: { $ref: '#/components/schemas/TestKind' }
            coverUrl: { type: [string, 'null'] }
        class:
          description: The class it was started from, or null when practised alone
          oneOf:
            - type: 'null'
            - type: object
              properties:
                id: { $ref: '#/components/schemas/Id' }
                name: { type: string }

    BandOrNull:
      type: [number, 'null']
      minimum: 0
      maximum: 9
      multipleOf: 0.5

    Assignment:
      type: object
      properties:
        id: { $ref: '#/components/schemas/Id' }
        classId: { $ref: '#/components/schemas/Id' }
        deadline: { type: string, format: date-time }
        allowLate: { type: boolean }
        createdAt: { type: string, format: date-time }
        test:
          type: object
          properties:
            id: { $ref: '#/components/schemas/Id' }
            title: { type: string }
            skill: { $ref: '#/components/schemas/Skill' }
            kind: { type: string, enum: [full, single] }
            durationMin: { type: integer }
            questionCount: { type: integer }
        submittedCount: { type: integer, description: Teachers only }
        studentCount: { type: integer, description: Teachers only }
        averageBand:
          type: [number, 'null']
          description: Teachers only. Average band of the students who submitted (latest submission each), rounded to 0.5; null for tests that are not full
        averageCorrect:
          type: [number, 'null']
          description: Teachers only. Average number of correct answers, one decimal; null when nobody has submitted
        myStatus:
          type: string
          enum: [todo, in_progress, submitted, late, missed]
          description: Students only
        myAttemptId: { type: [string, 'null'], description: Students only }
        myResult:
          description: Students only
          oneOf:
            - $ref: '#/components/schemas/Result'
            - type: 'null'

    VocabSetInput:
      type: object
      properties:
        name: { type: string, maxLength: 80, description: Required when creating }
        color: { type: string, enum: [purple, blue, green, orange, pink] }
        coverUrl: { type: [string, 'null'] }

    VocabSetSummary:
      type: object
      required: [id, name, color, coverUrl, wordCount, preview]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        color: { type: string, enum: [purple, blue, green, orange, pink] }
        coverUrl: { type: [string, 'null'] }
        wordCount: { type: integer }
        preview:
          type: array
          description: The first 4 terms
          items: { type: string }
        updatedAt: { type: string, format: date-time }

    VocabSet:
      allOf:
        - $ref: '#/components/schemas/VocabSetSummary'
        - type: object
          required: [words]
          properties:
            words:
              type: array
              items: { $ref: '#/components/schemas/VocabWord' }

    VocabWordInput:
      type: object
      required: [term, meaning]
      properties:
        type: { type: string, enum: [n, v, adj, adv, phr, other], description: Anything else becomes "other" }
        term: { type: string, maxLength: 80 }
        meaning: { type: string, maxLength: 200 }
        note: { type: string }
        verbForms: { type: string, description: Kept only when type is "v" }
        collocations: { type: string }
        example: { type: string }

    VocabWord:
      allOf:
        - $ref: '#/components/schemas/VocabWordInput'
        - type: object
          required: [id]
          properties:
            id: { $ref: '#/components/schemas/Id' }

    Feedback:
      type: object
      properties:
        summary: { type: string }
        weakTypes: { type: array, items: { type: string }, maxItems: 2 }
        tips: { type: array, items: { type: string }, maxItems: 3 }
        model: { type: string }
        createdAt: { type: string, format: date-time }
